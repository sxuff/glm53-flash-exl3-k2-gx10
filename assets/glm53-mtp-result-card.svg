<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="836" viewBox="0 0 1600 836">
  <rect width="1600" height="836" fill="#f6f6f3"/>
  <rect x="54" y="44" width="1492" height="748" rx="26" fill="#fbfbf9" stroke="#d2d2cd"/>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #151517; }
    .title { font-size: 34px; font-weight: 750; letter-spacing: -1px; }
    .sub { font-size: 17px; fill: #68686f; }
    .label { font-size: 17px; font-weight: 700; fill: #4f4f57; }
    .label-accent { font-size: 17px; font-weight: 700; fill: #4f3da8; }
    .number { font-size: 72px; font-weight: 780; letter-spacing: -3px; }
    .unit { font-size: 17px; fill: #68686f; }
    .unit-accent { font-size: 17px; font-weight: 650; fill: #5545a7; }
    .proof-label { font-size: 15px; font-weight: 650; fill: #68686f; }
    .proof-value { font-size: 31px; font-weight: 760; letter-spacing: -1px; }
    .proof-note { font-size: 14px; fill: #68686f; }
    .row-key { font-size: 15px; font-weight: 650; fill: #68686f; }
    .row-value { font-size: 15px; font-weight: 590; }
    .note { font-size: 13px; fill: #515159; }
    .footer { font-size: 13px; fill: #77777d; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <text class="title" x="92" y="112">GLM-5.3-Flash UD-IQ2_XXS · native MTP n=2</text>
  <text class="sub" x="92" y="147">NVIDIA GB10, 128 GB unified · llama.cpp · single 8K slot · temperature 0, seed 42 · 4 matched requests per arm</text>

  <rect x="92" y="172" width="640" height="164" rx="18" fill="#efefec" stroke="#d9d9d4"/>
  <text class="label" x="118" y="210">No MTP</text>
  <text class="number" x="118" y="282">18.4</text>
  <text class="unit" x="118" y="317">tok/s · mean server decode</text>

  <text x="768" y="273" font-size="48" fill="#9b9ba0">→</text>

  <rect x="824" y="172" width="640" height="164" rx="18" fill="#eeeafd" stroke="#c9c0f3"/>
  <text class="label-accent" x="850" y="210">Native MTP n=2</text>
  <text class="number" x="850" y="282">27.7</text>
  <text class="unit-accent" x="850" y="317">tok/s · 1.50× · +50.4%</text>

  <rect x="92" y="352" width="512" height="112" rx="15" fill="#ffffff" stroke="#d9d9d4"/>
  <text class="proof-label" x="112" y="379">Independently reproduced</text>
  <text class="proof-value" x="112" y="416">1.502×</text>
  <text class="proof-note" x="112" y="446">fresh rerun: 18.25 → 27.41 tok/s</text>

  <rect x="618" y="352" width="412" height="112" rx="15" fill="#ffffff" stroke="#d9d9d4"/>
  <text class="proof-label" x="638" y="379">Requests completed</text>
  <text class="proof-value" x="638" y="416">4 / 4</text>
  <text class="proof-note" x="638" y="446">both arms · matched payloads 4/4</text>

  <rect x="1044" y="352" width="420" height="112" rx="15" fill="#ffffff" stroke="#d9d9d4"/>
  <text class="proof-label" x="1064" y="379">Swap, both arms</text>
  <text class="proof-value" x="1064" y="416">0 B</text>
  <text class="proof-note" x="1064" y="446">service and host growth</text>

  <line x1="92" y1="483" x2="1464" y2="483" stroke="#d9d9d4"/>
  <text class="row-key" x="92" y="512">Draft source</text>
  <text class="row-value" x="282" y="512">native MTP head in checkpoint, no extra draft model</text>
  <line x1="92" y1="528" x2="1464" y2="528" stroke="#d9d9d4"/>
  <text class="row-key" x="92" y="557">Artifact</text>
  <text class="row-value" x="282" y="557">95.93 GiB including projector · 5/5 files SHA-256 verified</text>
  <line x1="92" y1="573" x2="1464" y2="573" stroke="#d9d9d4"/>
  <text class="row-key" x="92" y="602">Runtime</text>
  <text class="row-value" x="282" y="602">unslothai/llama.cpp · commit 629b505 · Flash Attention · full GPU offload</text>
  <line x1="92" y1="618" x2="1464" y2="618" stroke="#d9d9d4"/>
  <text class="row-key" x="92" y="647">Serving now</text>
  <text class="row-value" x="282" y="647">MTP n=2 active on one GX10 · SSE streaming verified · service swap 0 B</text>
  <line x1="92" y1="663" x2="1464" y2="663" stroke="#d9d9d4"/>

  <text class="note" x="92" y="695">Headline pair is the original measured receipt, 18.40 → 27.67 tok/s. A fresh end-to-end run reproduced the speedup at 1.502×.</text>
  <text class="note" x="92" y="715">Both arms used the same artifact, runtime, prompts, sampler, context, and generation length. Only speculative decoding changed.</text>
  <text class="footer" x="92" y="754">github.com/sxuff/glm53-flash-exl3-k2-gx10 · gguf/results/summary.json</text>
</svg>
